# Repository settings as code, applied by the Probot "Settings" GitHub App:
#   https://github.com/apps/settings
#
# The app must be installed on this repository (or the owning account) for this file to do
# anything at all -- it is inert otherwise. Changes are applied when this file is pushed to
# the default branch.
#
# Two footguns worth knowing before editing:
#   - Changing `name` RENAMES the repository.
#   - Changing `default_branch` renames the default branch.
# Both are applied silently and immediately.

repository:
  name: tinyxnb
  description: >-
    Native Windows Explorer thumbnails for XNA/MonoGame .xnb texture files,
    plus a right-click "Save as PNG" verb.
  homepage: https://github.com/regulad/scoop-regulad

  # Lowercase, digits and hyphens only; GitHub allows at most 20.
  topics: xnb, xna, monogame, fna, thumbnail-provider, shell-extension, windows-explorer, texture-decoder, dxt, bcn, dotnet, csharp, com, scoop, stardew-valley

  private: false
  default_branch: main

  has_issues: true
  has_wiki: false
  has_projects: false
  has_downloads: true

  allow_squash_merge: true
  allow_merge_commit: true
  allow_rebase_merge: true
  delete_branch_on_merge: true
